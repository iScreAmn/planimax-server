name: planimax

services:
  planimax-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  planimax-api:
    image: ghcr.io/iscreamn/planimax-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5055
    depends_on:
      planimax-db:
        condition: service_healthy
    networks:
      - internal
      - edge
    expose:
      - '5055'

  planimax-web:
    image: ghcr.io/iscreamn/planimax-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - edge
    expose:
      - '3000'

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: portfolio_internal
